# Generated by mcctl for server paper from server.env and modpack.env. Do not edit: the next change to the server overwrites it.
# Nothing is published on the host: the game container is reached only through mc-router, over the mcctl_game network.
# No credential is a value in this file: each is a file under secrets/, mounted at /run/secrets and named with the _FILE suffix.
services:
  mc:
    image: itzg/minecraft-server
    container_name: "mc-paper"
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: "5376m"
    cpus: 2
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.1"
      MEMORY: "4G"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      ENABLE_WHITELIST: "true"
      SPAWN_PROTECTION: "0"
    labels:
      - "mcctl.managed=true"
      - "mcctl.name=paper"
      - "mcctl.hostname=paper"
      - "mc-router.host=paper.mc.example.net"
      - "mcctl.config_hash="
    secrets:
      - rcon_password
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      - ./plugins:/plugins:ro
    networks:
      - mcctl_game
  backup:
    image: itzg/mc-backup
    container_name: "mc-paper-backup"
    restart: unless-stopped
    labels:
      - "mcctl.backup-for=paper"
    environment:
      RCON_HOST: "127.0.0.1"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      SRC_DIR: "/data"
      DEST_DIR: "/backups"
      BACKUP_NAME: "paper"
      BACKUP_INTERVAL: "2h"
      PRUNE_BACKUPS_COUNT: "7"
    secrets:
      - rcon_password
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    network_mode: "service:mc"
    depends_on: [mc]
networks:
  mcctl_game:
    external: true
secrets:
  rcon_password:
    file: "../../secrets/rcon-paper"
