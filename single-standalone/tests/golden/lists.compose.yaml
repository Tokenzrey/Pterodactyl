# Generated by mcctl for server lists from server.env and modpack.env. Do not edit: the next change to the server overwrites it.
# Nothing is published on the host: the game container is reached only through mc-router, over the mcctl_game network.
# No credential is a value in this file: each is a file under secrets/, mounted at /run/secrets and named with the _FILE suffix.
services:
  mc:
    image: itzg/minecraft-server
    container_name: "mc-lists"
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: "5376m"
    cpus: 2
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.1"
      MEMORY: "4G"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      MODS: |
        https://cdn.example.net/a.jar
        /mods/local.jar
      PLUGINS: |
        /plugins/common
      MODRINTH_PROJECTS: |
        fabric-api
        lithium:mc1.21-0.13.0
    labels:
      - "mcctl.managed=true"
      - "mcctl.name=lists"
      - "mcctl.hostname=lists"
      - "mc-router.host=lists.mc.example.net"
      - "mcctl.config_hash="
    secrets:
      - rcon_password
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      - ./plugins:/plugins:ro
    networks:
      - mcctl_game
  backup:
    image: itzg/mc-backup
    container_name: "mc-lists-backup"
    restart: unless-stopped
    labels:
      - "mcctl.backup-for=lists"
    environment:
      RCON_HOST: "127.0.0.1"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      SRC_DIR: "/data"
      DEST_DIR: "/backups"
      BACKUP_NAME: "lists"
    secrets:
      - rcon_password
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    network_mode: "service:mc"
    depends_on: [mc]
networks:
  mcctl_game:
    external: true
secrets:
  rcon_password:
    file: "../../secrets/rcon-lists"
