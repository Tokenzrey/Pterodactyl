# Generated by mcctl for server settings from server.env and modpack.env. Do not edit: the next change to the server overwrites it.
# Nothing is published on the host: the game container is reached only through mc-router, over the mcctl_game network.
# No credential is a value in this file: each is a file under secrets/, mounted at /run/secrets and named with the _FILE suffix.
services:
  mc:
    image: itzg/minecraft-server
    container_name: "mc-settings"
    restart: "no"
    stop_grace_period: 60s
    mem_limit: "2816m"
    cpus: 2
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.1"
      MEMORY: "2G"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      MAX_PLAYERS: "20"
      MOTD: "Cost: $$5 \"VIP\" C:\\games §"
      PVP: "FALSE"
      SPAWN_PROTECTION: "0"
    labels:
      - "mcctl.managed=true"
      - "mcctl.name=settings"
      - "mcctl.hostname=settings"
      - "mc-router.host=settings.mc.example.net"
      - "mcctl.config_hash="
    secrets:
      - rcon_password
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      - ./plugins:/plugins:ro
    networks:
      - mcctl_game
  backup:
    image: itzg/mc-backup
    container_name: "mc-settings-backup"
    restart: "no"
    labels:
      - "mcctl.backup-for=settings"
    environment:
      RCON_HOST: "127.0.0.1"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      SRC_DIR: "/data"
      DEST_DIR: "/backups"
      BACKUP_NAME: "settings"
    secrets:
      - rcon_password
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    network_mode: "service:mc"
    depends_on: [mc]
networks:
  mcctl_game:
    external: true
secrets:
  rcon_password:
    file: "../../secrets/rcon-settings"
