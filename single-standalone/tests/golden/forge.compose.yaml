# Generated by mcctl for server forge from server.env and modpack.env. Do not edit: the next change to the server overwrites it.
# Nothing is published on the host: the game container is reached only through mc-router, over the mcctl_game network.
# No credential is a value in this file: each is a file under secrets/, mounted at /run/secrets and named with the _FILE suffix.
services:
  mc:
    image: itzg/minecraft-server
    container_name: "mc-forge"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 60s
    mem_limit: "7936m"
    cpus: 4
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "6G"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      FORGE_VERSION: "47.3.0"
    labels:
      - "mcctl.managed=true"
      - "mcctl.name=forge"
      - "mcctl.hostname=forge"
      - "mc-router.host=forge.mc.example.net"
      - "mcctl.config_hash="
    secrets:
      - rcon_password
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      - ./plugins:/plugins:ro
    networks:
      - mcctl_game
  backup:
    image: itzg/mc-backup
    container_name: "mc-forge-backup"
    restart: unless-stopped
    # the sidecar must not compete with the game: one CPU at most (gzip -1 of a world takes a minute), 512 MiB (tar streams the files)
    cpus: 1
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "mcctl.backup-for=forge"
    environment:
      RCON_HOST: "127.0.0.1"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      SRC_DIR: "/data"
      DEST_DIR: "/backups"
      BACKUP_NAME: "forge"
    secrets:
      - rcon_password
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    network_mode: "service:mc"
    depends_on: [mc]
networks:
  mcctl_game:
    external: true
secrets:
  rcon_password:
    file: "../../secrets/rcon-forge"
