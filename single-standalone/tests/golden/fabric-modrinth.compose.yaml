# Generated by mcctl for server fabric-modrinth from server.env and modpack.env. Do not edit: the next change to the server overwrites it.
# Nothing is published on the host: the game container is reached only through mc-router, over the mcctl_game network.
# No credential is a value in this file: each is a file under secrets/, mounted at /run/secrets and named with the _FILE suffix.
services:
  mc:
    image: itzg/minecraft-server
    container_name: "mc-fabric-modrinth"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 60s
    mem_limit: "5376m"
    cpus: 3
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.20.4"
      MEMORY: "4G"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      MODRINTH_PROJECTS: "fabric-api,lithium,ferrite-core"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
    labels:
      - "mcctl.managed=true"
      - "mcctl.name=fabric-modrinth"
      - "mcctl.hostname=fabric"
      - "mc-router.host=fabric.mc.example.net"
      - "mcctl.config_hash="
    secrets:
      - rcon_password
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      - ./plugins:/plugins:ro
    networks:
      - mcctl_game
  backup:
    image: itzg/mc-backup
    container_name: "mc-fabric-modrinth-backup"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "mcctl.backup-for=fabric-modrinth"
    environment:
      RCON_HOST: "127.0.0.1"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      SRC_DIR: "/data"
      DEST_DIR: "/backups"
      BACKUP_NAME: "fabric-modrinth"
    secrets:
      - rcon_password
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    network_mode: "service:mc"
    depends_on: [mc]
networks:
  mcctl_game:
    external: true
secrets:
  rcon_password:
    file: "../../secrets/rcon-fabric-modrinth"
